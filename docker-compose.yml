services:
  db:
    image: postgres:18
    container_name: sistema_kiki_db
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: